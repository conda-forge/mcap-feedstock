{% set name = "mcap" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mcap-{{ version }}.tar.gz
  sha256: 0528e2f86a61bfec73779e0628e6cf27af83d01d89e20b27d5ec9f0b556a63ac

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - lz4
    - zstandard

test:
  imports:
    - mcap
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/foxglove/mcap
  summary: MCAP libraries for Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - MilkClouds
